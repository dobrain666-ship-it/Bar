<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>ɴᴀɪʀᴏɴ x ᴍᴀᴠɪᴀ · PROXY</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#06060c;color:#f5f5fa;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
    .box{max-width:400px}
    h1{font-size:22px;letter-spacing:3px;background:linear-gradient(90deg,#a78bfa,#22d3ee,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
    p{color:#8b8ba7;font-size:13px;letter-spacing:1px;line-height:1.7;margin-bottom:8px}
    .code{background:#111;border:1px solid rgba(124,92,255,.2);padding:12px 16px;border-radius:10px;font-family:monospace;font-size:11px;color:#a78bfa;margin-top:14px;word-break:break-all}
  </style>
</head>
<body>
  <div class="box">
    <h1>ɴᴀɪʀᴏɴ x ᴍᴀᴠɪᴀ</h1>
    <p>PROXY SERVER · ACTIVE</p>
    <p>Status: <span style="color:#34d399">● ONLINE</span></p>
    <div class="code">GET /?key=YOUR_KEY</div>
  </div>
</body>
</html>
